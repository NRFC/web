# NRFC production Apache hardening

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header unset X-Powered-By
</IfModule>

# Never execute PHP from the uploads directory.
<Directory /var/www/nrfc/wp-content/uploads>
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# Block access to sensitive files.
<FilesMatch "^(wp-config(-docker|-sample)?\.php|readme\.html|license\.txt|\.ht.*)$">
    Require all denied
</FilesMatch>
