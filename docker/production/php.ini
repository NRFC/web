# Production PHP Configuration
# Optimized for security and performance in production environments

; Core Settings
expose_php = Off
short_open_tag = Off

; Memory and Limits
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 128M
upload_max_filesize = 128M
max_file_uploads = 20

; Session Settings
session.save_handler = files
session.save_path = /var/lib/php/sessions
session.gc_maxlifetime = 86400
session.gc_divisor = 1000
session.gc_probability = 1

; Security Settings
; Note: WordPress needs these permissive settings but they're hardened by .htaccess
default_charset = "UTF-8"
allow_url_fopen = On
allow_url_include = Off

; Error Reporting (already set in Dockerfile but included here for reference)
; error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; display_errors = Off
; log_errors = On

; Date
date.timezone = UTC

; Logging
error_log = /proc/self/fd/2

; OPcache settings (further tuned for production)
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 0
opcache.max_file_size = 0
opcache.fast_shutdown = 1
opcache.enable_cli = 0
opcache.save_comments = 1
opcache.load_comments = 1

; Additional hardening
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,proc_terminate,proc_get_status,proc_nice,proc_close,pfsockopen,fsocket,dl

; Database
pdo_mysql.cache_size = 2000

