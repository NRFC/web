; NRFC production PHP overrides (loaded after the upstream defaults)

expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_vars = 3000
upload_max_filesize = 64M
post_max_size = 64M

; Errors are logged to stderr by the upstream error-logging.ini
display_errors = Off
display_startup_errors = Off
log_errors = On

session.cookie_httponly = 1
session.use_strict_mode = 1

; Code is immutable inside the image, so never re-stat PHP files.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
