# Production Docker Compose configuration
# Usage: docker-compose -f compose.production.yaml up -d
# This setup includes:
# - Nginx reverse proxy on port 80
# - PHP-FPM backend
# - MariaDB database
# - Persistent uploads volume
# - WordPress core baked into the Nginx and PHP images

services:
  # Nginx reverse proxy
  nrfc-wp-prod-nginx:
    image: ghcr.io/nrfc/wp-prod-nginx
    container_name: nrfc-wp-prod-nginx
    ports:
      - "${WORDPRESS_PORT:-8015}:80"
    volumes:
      - ./uploads:/var/www/html/wp-content/uploads:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      nrfc-wp-prod-php:
        condition: service_healthy
    environment:
      TZ: UTC
    restart: unless-stopped
    networks:
      - nrfc-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PHP-FPM application server
  nrfc-wp-prod-php:
    image: ghcr.io/nrfc/wp-prod-php
    container_name: nrfc-wp-prod-php
    command: ["php-fpm", "-F"]
    volumes:
      - ./uploads:/var/www/html/wp-content/uploads:rw
      - php-fpm-logs:/var/log/php-fpm
    environment:
      WORDPRESS_DB_HOST: nrfc-wp-prod-db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DEBUG: "false"
      WP_DEBUG_LOG: /var/log/php/debug.log
      WP_ENV: production
      TZ: UTC
    depends_on:
      nrfc-wp-prod-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nrfc-network
    healthcheck:
      test: ["CMD", "sh", "-c", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MariaDB database server
  nrfc-wp-prod-db:
    image: mariadb:11
    container_name: nrfc-wp-prod-db
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD is required}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      TZ: UTC
      MYSQL_INITDB_SKIP_TZINFO: "1"
    restart: unless-stopped
    networks:
      - nrfc-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Security: No ports exposed to host
    # Access only through containers on the same network

volumes:
  db-data:
    driver: local
  nginx-logs:
    driver: local
  php-fpm-logs:
    driver: local

networks:
  nrfc-network:
    driver: bridge

