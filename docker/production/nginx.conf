# Nginx configuration for WordPress with FastCGI
# This configuration runs behind a reverse proxy

upstream php-upstream {
    server nrfc-wp-prod-php:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html index.htm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Deny access to hidden files and directories
    location ~ /\. {
        access_log off;
        log_not_found off;
        deny all;
    }

    # Deny access to specific sensitive files
    location ~ ~$ {
        access_log off;
        log_not_found off;
        deny all;
    }

    # WordPress rewrite rules
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # WordPress admin
    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s;
        try_files $uri =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        include fastcgi_params;

        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # WordPress media files (images, documents, etc.)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploads directory
    location /wp-content/uploads/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny direct access to wp-config.php and other sensitive files
    location ~ ^/wp-config\.php$ {
        deny all;
    }

    location ~ ^/wp-settings\.php$ {
        deny all;
    }

    # Deny access to uploads with certain extensions
    location ~ ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Favicon and robots.txt
    location ~ ^/(favicon\.ico|robots\.txt)$ {
        access_log off;
        log_not_found off;
    }

    # xmlrpc.php protection
    location ~ ^/xmlrpc\.php$ {
        deny all;
    }

    # wp-json access (WordPress REST API)
    location /wp-json/ {
        try_files $uri $uri/ /index.php?rest_route=$uri;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

